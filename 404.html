<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found — Lexi Crew Enterprises</title>
  <meta name="description" content="The page you're looking for doesn't exist. Return to Lexi Crew Enterprises homepage." />
  <meta name="robots" content="noindex, follow" />
  <link rel="canonical" href="https://www.lexicrewenterprises.com/" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />

  <style>
    :root {
      --clr-text-main: #F0F4FF;
      --clr-text-muted: #94A3B8;
      --ff-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --ff-heading: 'Syne', sans-serif;
    }

    [data-theme="light"] {
      --clr-text-main: #0F172A;
      --clr-text-muted: #475569;
    }

    html, body {
      min-height: 100vh;
      margin: 0;
      background: var(--clr-bg);
      font-family: var(--ff-sans);
      color: var(--clr-text-main);
    }

    .notfound-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 2rem;
      position: relative;
      overflow: hidden;
    }

    .notfound-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.15;
      pointer-events: none;
    }

    .notfound-orb-1 {
      width: 500px; height: 500px;
      background: #3B82F6;
      top: -100px; right: -100px;
    }

    .notfound-orb-2 {
      width: 400px; height: 400px;
      background: #8B5CF6;
      bottom: -80px; left: -80px;
    }

    .notfound-content {
      position: relative;
      z-index: 5;
      max-width: 560px;
    }

    .notfound-code {
      font-family: var(--ff-heading);
      font-size: clamp(6rem, 20vw, 10rem);
      font-weight: 800;
      line-height: 1;
      margin: 0;
      background: linear-gradient(135deg, #3B82F6 0%, #8B5CF6 50%, #EC4899 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.04em;
    }

    .notfound-title {
      font-family: var(--ff-heading);
      font-size: clamp(1.5rem, 4vw, 2.2rem);
      font-weight: 700;
      margin: 0.5rem 0 1rem;
      color: var(--clr-text-main);
    }

    .notfound-sub {
      font-size: 1rem;
      color: var(--clr-text-muted);
      margin-bottom: 2.25rem;
      line-height: 1.7;
    }

    .notfound-actions {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .notfound-logo {
      display: inline-flex;
      align-items: center;
      gap: 0.65rem;
      text-decoration: none;
      margin-bottom: 2.5rem;
    }

    .notfound-logo img {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      object-fit: cover;
    }

    .notfound-logo-name {
      font-family: var(--ff-heading);
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--clr-text-main);
    }

    .countdown-txt {
      font-size: 0.8rem;
      color: var(--clr-text-muted);
      margin-top: 1.5rem;
    }

    #autoRedirectTimer {
      color: var(--clr-blue-light);
      font-weight: 700;
    }
  </style>
</head>
<body>

  <div class="notfound-wrapper">
    <!-- Decorative orbs -->
    <div class="notfound-orb notfound-orb-1"></div>
    <div class="notfound-orb notfound-orb-2"></div>

    <div class="notfound-content">
      <a href="index.html" class="notfound-logo" aria-label="Lexi Crew Enterprises Home">
        <img src="Logo.jpeg" alt="Lexi Crew Enterprises logo" />
        <span class="notfound-logo-name">Lexi Crew</span>
      </a>

      <div class="notfound-code" aria-label="Error 404">404</div>

      <h1 class="notfound-title">Page Not Found</h1>

      <p class="notfound-sub">
        Oops! The page you're looking for has moved, been removed, or never existed.<br />
        Let's get you back on track.
      </p>

      <div class="notfound-actions">
        <a href="index.html" class="btn btn-primary">← Back to Home</a>
        <a href="index.html#contact" class="btn btn-outline">Contact Us</a>
      </div>

      <p class="countdown-txt">
        Redirecting to homepage in <span id="autoRedirectTimer">10</span>s...
        <a href="index.html" style="color:var(--clr-blue-light);text-decoration:none;margin-left:0.25rem;">Go now →</a>
      </p>
    </div>
  </div>

  <script>
    // Theme
    const saved = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', saved);

    // Auto-redirect countdown
    let count = 10;
    const timerEl = document.getElementById('autoRedirectTimer');
    const interval = setInterval(() => {
      count--;
      timerEl.textContent = count;
      if (count <= 0) {
        clearInterval(interval);
        window.location.href = 'index.html';
      }
    }, 1000);
  </script>
</body>
</html>

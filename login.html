<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — Lexi Crew Enterprises</title>
  <meta name="robots" content="noindex, nofollow" />
  
  <!-- Favicon & Fonts -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  
  <link rel="stylesheet" href="styles.css" />

  <style>
    :root {
      --clr-text-main: #F0F4FF;
      --clr-text-muted: #94A3B8;
      --ff-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --ff-heading: 'Syne', sans-serif;
    }

    [data-theme="light"] {
      --clr-text-main: #0F172A;
      --clr-text-muted: #475569;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: var(--clr-bg);
      font-family: var(--ff-sans);
      color: var(--clr-text-main);
      padding: 1.5rem;
      position: relative;
      overflow-x: hidden;
    }

    .login-container {
      width: 100%;
      max-width: 440px;
      position: relative;
      z-index: 10;
    }

    .login-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .login-logo {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      margin-bottom: 1.25rem;
    }

    .login-logo img {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      object-fit: cover;
      border: 2px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .login-title-wrap h1 {
      font-family: var(--ff-heading);
      font-size: 1.6rem;
      font-weight: 800;
      background: linear-gradient(135deg, #FFFFFF 0%, var(--clr-blue-light) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 0;
      letter-spacing: -0.02em;
    }

    .login-badge {
      display: inline-block;
      margin-top: 0.5rem;
      padding: 0.25rem 0.75rem;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--clr-blue-light);
      background: rgba(59, 130, 246, 0.12);
      border: 1px solid rgba(59, 130, 246, 0.25);
      border-radius: 999px;
    }

    .login-card {
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 2.25rem;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 30px rgba(59, 130, 246, 0.08);
      position: relative;
      overflow: hidden;
    }

    [data-theme="light"] .login-card {
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(226, 232, 240, 0.8);
      box-shadow: 0 20px 50px rgba(15, 23, 42, 0.08);
    }

    .login-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, #3B82F6, #8B5CF6, #EC4899);
    }

    .form-group {
      margin-bottom: 1.35rem;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: var(--clr-text-main);
    }

    .input-wrap {
      position: relative;
    }

    .input-wrap input {
      width: 100%;
      padding: 0.85rem 1rem;
      padding-left: 2.6rem;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.05);
      color: var(--clr-text-main);
      font-size: 0.95rem;
      transition: all 0.25s ease;
    }

    [data-theme="light"] .input-wrap input {
      background: #F8FAFC;
      border-color: #E2E8F0;
      color: #0F172A;
    }

    .input-wrap input:focus {
      outline: none;
      border-color: var(--clr-blue);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
      background: rgba(255, 255, 255, 0.08);
    }

    .input-icon {
      position: absolute;
      left: 0.9rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--clr-text-muted);
      pointer-events: none;
      display: flex;
    }

    .pw-toggle {
      position: absolute;
      right: 0.9rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--clr-text-muted);
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      transition: color 0.2s;
    }

    .pw-toggle:hover {
      color: var(--clr-text-main);
    }

    .login-error {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #F87171;
      padding: 0.75rem 1rem;
      border-radius: 10px;
      font-size: 0.85rem;
      margin-bottom: 1.25rem;
      display: none;
      align-items: center;
      gap: 0.5rem;
    }

    .login-error.show {
      display: flex;
    }

    .login-submit-btn {
      width: 100%;
      padding: 0.9rem;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #3B82F6 0%, #2563EB 100%);
      color: white;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.35);
      transition: all 0.25s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
    }

    .login-submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.5);
    }

    .demo-credentials {
      margin-top: 1.75rem;
      padding: 0.85rem;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px dashed rgba(255, 255, 255, 0.15);
      font-size: 0.8rem;
      color: var(--clr-text-muted);
      text-align: center;
    }

    [data-theme="light"] .demo-credentials {
      background: #F1F5F9;
      border-color: #CBD5E1;
    }

    .demo-credentials code {
      background: rgba(59, 130, 246, 0.15);
      color: var(--clr-blue-light);
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
    }

    .theme-toggle-top {
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
    }

    .back-home {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      margin-top: 1.5rem;
      color: var(--clr-text-muted);
      font-size: 0.85rem;
      text-decoration: none;
      transition: color 0.2s;
    }

    .back-home:hover {
      color: var(--clr-blue-light);
    }
  </style>
</head>
<body>

  <!-- Theme Toggle -->
  <div class="theme-toggle-top">
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
      <span class="theme-toggle-track">
        <span class="theme-toggle-thumb">
          <svg class="icon-moon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <svg class="icon-sun" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        </span>
      </span>
    </button>
  </div>

  <div class="login-container">
    <div class="login-header">
      <div class="login-logo">
        <img src="Logo.jpeg" alt="Lexi Crew Logo" />
        <div class="login-title-wrap">
          <h1>Lexi Crew</h1>
          <span class="login-badge">🔒 Admin Portal</span>
        </div>
      </div>
    </div>

    <div class="login-card">
      <!-- Error Alert -->
      <div class="login-error" id="loginError" role="alert">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span id="errorText">Invalid username or password.</span>
      </div>

      <form id="loginForm" autocomplete="on">
        <div class="form-group">
          <label for="username">Username</label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </span>
            <input type="text" id="username" name="username" placeholder="Enter username..." required autocomplete="username" />
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrap">
            <span class="input-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </span>
            <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password" />
            <button type="button" class="pw-toggle" id="pwToggle" aria-label="Toggle password visibility">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <button type="submit" class="login-submit-btn" id="submitBtn">
          Sign In to Dashboard →
        </button>
      </form>
    </div>

    <div style="text-align:center;">
      <a href="index.html" class="back-home">← Back to Lexi Crew Website</a>
    </div>
  </div>

  <script>
    // Theme Toggle Logic
    const toggle = document.getElementById('themeToggle');
    const html   = document.documentElement;
    function applyTheme(theme) {
      html.setAttribute('data-theme', theme);
    }
    const savedTheme = localStorage.getItem('theme') || 'dark';
    applyTheme(savedTheme);
    toggle.addEventListener('click', () => {
      const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      applyTheme(next);
      localStorage.setItem('theme', next);
    });

    // Check if already logged in
    if (sessionStorage.getItem('lexicrew_admin_logged_in') === 'true') {
      window.location.href = 'admin.html';
    }

    // Password Toggle
    const pwInput = document.getElementById('password');
    const pwToggle = document.getElementById('pwToggle');
    pwToggle.addEventListener('click', () => {
      const type = pwInput.type === 'password' ? 'text' : 'password';
      pwInput.type = type;
    });

    // Handle Login
    const form = document.getElementById('loginForm');
    const errorEl = document.getElementById('loginError');
    const errorText = document.getElementById('errorText');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value;

      const validUsers = ['admin', 'rakesh', 'gowtham'];
      const validPasses = ['admin123', 'lexicrew2026'];

      if (validUsers.includes(user.toLowerCase()) && validPasses.includes(pass)) {
        sessionStorage.setItem('lexicrew_admin_logged_in', 'true');
        sessionStorage.setItem('lexicrew_admin_user', user);
        window.location.href = 'admin.html';
      } else {
        errorText.textContent = 'Invalid username or password. Please try again.';
        errorEl.classList.add('show');
      }
    });
  </script>
</body>
</html>
